# The dsh-base bundle patch: the shared core of each base-backed profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: tool-plugin-manager
      name: '@deepseek-ai/dsh-plugin-manager/tools'
      disabled: true

    - id: plugin-manager
      name: '@deepseek-ai/dsh-plugin-manager'
      disabled: !!js "!ctx.get('profileContext')"

    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    # Profile configuration reloads by default; module roots are opt-in.
    - id: hmr
      name: '@deepseek-ai/dsh-hmr'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        root: []

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-log-deepseek
      name: '@deepseek-ai/dsh-session-log-deepseek'

    - id: typert
      name: '@deepseek-ai/dsh-typert-registry'

    - id: typert-loader
      name: '@deepseek-ai/dsh-typert-loader'

    - id: typert-gateway
      name: '@deepseek-ai/dsh-api-gateway'

    # Method-level access control for non-owner Peers; the Gateway requires it,
    # and its Client half publishes the standard access Hooks.
    - id: remote-access
      name: '@deepseek-ai/dsh-api-remote-access'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        # A ceiling against runaway output, not a length target: the prompt
        # keeps titles short, while reasoning a model cannot switch off also
        # counts as output. Stays within common model output limits.
        maxOutputTokens: 4096
        timeoutMs: 60000

    - id: user-questions
      name: '@deepseek-ai/dsh-user-questions'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: plugin-package-inventory-deepseek
      name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-flash

    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    # Live Config forms persist through the active profile patch.

    # Live configuration forms persist through the launcher's profile.
    - id: config-editor
      name: '@deepseek-ai/dsh-config-editor'
      disabled: !!js "!ctx.get('profileContext')"

    - id: settings
      name: '@deepseek-ai/dsh-settings'
      disabled: !!js "!ctx.get('profileContext')"

    # Credential sources: managed `$DSH_HOME/.credentials.yaml`, then inherited
    # environment, project `.env`, and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: deepseek-account
      name: '@deepseek-ai/dsh-deepseek-account-platform'
      config:
        desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"

    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    # The pi-ai multi-provider twin, mounted dormant: zero routes (and no extra
    # models in the picker) until a `llm-pi-ai:` settings section supplies provider
    # profiles — then those routes register live, keys resolving per request
    # through their apiKeyEnv references, and drop again when the section empties.
    # Supplying those profiles is exactly what the web Models page does. Which
    # adapters exist is composition; which providers run is the user's settings
    # document.
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'

    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Cross-session token usage. Derived on demand from the session logs
    # themselves — no counter runs in the loop — so `/usage` covers history
    # written before this row existed. A per-session fold cache in
    # `session_usage_cache` keeps a repeat report from re-reading every log.
    - id: session-usage
      name: '@deepseek-ai/dsh-session-usage'

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: working-directory
      name: '@deepseek-ai/dsh-working-directory'

    - id: tool-working-directory
      name: '@deepseek-ai/dsh-tool-working-directory'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    # Durable KV storage: the storage hub, the json backend, and the
    # schema-validated domain form over them. Session-layer persistence (the
    # projection cache below; workspace in web layers)
    # routes through this stack, so it belongs to the shared base.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    # Persisted projection cache: throttled write-behind over the
    # session_projcache domain (per-record layout — one version-stamped
    # checkpoint document per session), serving the session listing's
    # projection column.
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: otel
      name: '@deepseek-ai/dsh-otel'

    # OTel releases a Session-log prefix only after explicit user feedback,
    # regardless of model provider. Ordinary activity never triggers capture.
    # DSH_TELEMETRY_OTLP_URL overrides the production endpoint. A non-empty
    # DSH_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out (the launchers patch the row disabled; config cannot disable
    # a row). Exports carry the harness home's anonymous user id ($DSH_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. Byte-bounded batching may turn an authorized prefix into
    # several HTTP requests. Requests run serially; each has its own 1s
    # transport timeout and 1.5s watchdog. A watchdog does not release the
    # active request slot. The outer 3s shutdown deadline stops queued sends;
    # large prefixes or an unsettled transport may leave records unsent.
    # Every CLI exit path drains by disposing the root on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: '@deepseek-ai/dsh-session-telemetry-otel'
      config:
        mode: !!js process.env.DSH_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        maxRequestBytes: 4000000
        exporter:
          url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://dsh-otel-collector.deepseeksvc.com/v1/logs'
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@deepseek-ai/dsh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@deepseek-ai/dsh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@deepseek-ai/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'

    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'
      config:
        requireDescription: false

    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'
      config:
        requireDescription: false

    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'

    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'

    # Hydra serves local models with 8K to 64K windows, where a 50 KB read can
    # fill most of the window. The reserve keeps room for this bundle's base
    # request (about 10,800 Claude tokens) and a compaction summary (up to
    # about 3,200); one read may fill half of the window left after it, so
    # compaction can keep each read whole beside them. Bytes per token is set
    # for dense text: 800 lines of a server log rendered to 52,212 bytes and
    # cost about 31,000 Claude Haiku 5.5 tokens. A 24K window reads 7,650
    # bytes at a time, 60K reads 38,250, and from about 75K up `readMaxBytes`
    # applies.
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
      config:
        readContextFraction: 0.5
        readBytesPerToken: 1.7
        readContextReserveTokens: 15000

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    # Records what each skill's files looked like when they were trusted, so an
    # edited or replaced skill is visible. `warnOnDrift` stays off: a goal loop
    # calling status every round would repeat the same warning forever.
    - id: skill-lock
      name: '@deepseek-ai/dsh-skill-lock'
      config:
        path: .dsh/skills.lock.json
        warnOnDrift: false

    - id: commands
      name: '@deepseek-ai/dsh-commands'

    - id: command-feedback
      name: '@deepseek-ai/dsh-command-feedback'

    # Goals run for days: no round cap, and a round that ends in a request
    # error, provider failure, or max-tokens cut re-arms with backoff (30s
    # doubling, capped) for up to 48 consecutive failures before it blocks;
    # `/goal resume` continues after that or after any hard interruption.
    - id: goal
      name: '@deepseek-ai/dsh-goal'
      config:
        defaultMaxGoalRounds: 0

    - id: goal-round-driver
      name: '@deepseek-ai/dsh-goal-round-driver'
      config:
        transientRetry:
          delayMs: 30000
          maxConsecutive: 48

    - id: command-goal
      name: '@deepseek-ai/dsh-command-goal'

    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    # Overflow recovery retries up to three compactions before the request
    # error surfaces; each retry prunes tool results and condenses the whole
    # compactable range again.
    # Hydra serves local models with 8K to 64K windows. The 65,536-token default
    # headroom leaves those routes no pressure budget, so it is lowered to the
    # small-context value; large windows still condense at the 0.8 ratio.
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        maxOverflowRetries: 3
        headroomTokens: 4096
        maxTokens: 8192

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: subagent
      name: '@deepseek-ai/dsh-subagent'

    - id: subagent-spawn-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@deepseek-ai/dsh-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent

    # Fork omits model-selection arguments for KV Cache reuse. Parent and child
    # share the messaging tools; return guidance follows the inherited history.
    # See packages/subagent/tool-subagent/README.md
    # and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork

    - id: ptc-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'

    # Records every workflow run and the agent() calls that completed, so a run
    # cut off by a lost connection or a spent budget is resumed with
    # `resumeRunId` instead of re-running work that already answered.
    # `/workflows` lists the runs and what resuming one would replay.
    - id: workflow-journal
      name: '@deepseek-ai/dsh-workflow-journal'

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'

    # Refuses shell commands that destroy what no checkpoint holds: discarding
    # uncommitted work, rewriting history, writing outside the workspace, or
    # reprogramming the machine. `confirm` asks a human about the first kind
    # and denies the rest; with nobody to ask, an unattended round denies
    # instead of hanging. Name a rule id under `allow` to accept one risk.
    - id: command-gate
      name: '@deepseek-ai/dsh-command-gate'
      config:
        mode: confirm
        unattendedMode: deny
        allow: []
        denyExtra: []
        temporaryRoots: []

    - id: spill-local
      name: '@deepseek-ai/dsh-spill-local'

    - id: spill-policy
      name: '@deepseek-ai/dsh-spill-policy'
      config:
        maxInlineTokens: 12500

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    # When an image-capable route rejects a request as over its image budget,
    # replace the oldest images with placeholders on the surface and retry.
    - id: image-offload
      name: '@deepseek-ai/dsh-compaction-image-offload'

    - id: tool-todo
      name: '@deepseek-ai/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    # Hydra's model-facing tools ship as their own rows, separate from the
    # services above that publish them. A service a host row injects belongs to
    # the host plane, so only the tool half can move behind an agent preset;
    # the Web overlay disables these six and each preset mounts them again.
    - id: tool-doctor
      name: '@deepseek-ai/dsh-doctor/tools'

    - id: tool-session-usage
      name: '@deepseek-ai/dsh-session-usage/tools'

    - id: tool-research
      name: '@deepseek-ai/dsh-research/tools'

    - id: tool-memory
      name: '@deepseek-ai/dsh-memory/tools'

    # knowledge_add attaches a folder the user names to the session's workspace
    # after the user approves it; search, read, and browse reach the configured
    # collections and the session's workspace collections.
    - id: tool-knowledge
      name: '@deepseek-ai/dsh-knowledge/tools'

    - id: tool-off-peak
      name: '@deepseek-ai/dsh-off-peak/tools'

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'

    # Durable goals: opening or resuming a session never re-arms its goal;
    # the human types `/goal resume`. The transient-retry policy on the round
    # driver keeps an armed goal running through request errors and cuts.
    # These two rows re-arm goals automatically (on session open, and for
    # stored sessions at boot); enable them in a profile patch to opt in.
    - id: goal-resume-on-open
      name: '@deepseek-ai/dsh-goal-resume-on-open'
      disabled: true
      config:
        policy: always

    - id: goal-supervisor
      name: '@deepseek-ai/dsh-goal-supervisor'
      disabled: true
      config:
        maxConcurrent: 4

    - id: goal-evaluator
      name: '@deepseek-ai/dsh-goal-evaluator'
      config:
        evidenceEvents: 12
        maxWorkspaceChangeEntries: 12
        maxOutputTokens: 512
        timeoutMs: 60000

    # Research goals: `/research <objective>` keeps a discovery journal under
    # `.dsh/research/<slug>/journal.md` in the workspace, records breakthroughs
    # the moment they happen, and re-injects the journal digest into every
    # request, so a compacted context or a new session continues from the
    # current state instead of a re-pasted prompt.
    - id: research
      name: '@deepseek-ai/dsh-research'
      config:
        dir: .dsh/research
        maxRecallBytes: 8000
        recentExperiments: 10
        relatedBreakthroughs: 5
        # `run_experiment` runs a budgeted command and records exit code, metrics,
        # deltas, and an output excerpt; after each experiment one auxiliary
        # request re-scores the open hypotheses so the next round takes the
        # best-supported one first. The scoring route defaults to the session's.
        scoring:
          enabled: true
          maxOutputTokens: 512
          timeoutMs: 60000
        maxExperimentMs: 600000
        maxOutputBytes: 20000

    # Market and investment research from keyless public sources: daily price
    # series from Stooq and issuer profiles and filings from SEC EDGAR. Both
    # rows ship disabled because EDGAR refuses a request that does not declare
    # who is making it, so there is no usable default; enable them in a profile
    # patch that names a real contact:
    #   - id: market-data
    #     disabled: false
    #     config:
    #       secUserAgent: Jane Roe jane@example.com
    #   - id: tool-market
    #     disabled: false
    - id: market-data
      name: '@deepseek-ai/dsh-market-data'
      disabled: true
      config:
        # Sent as User-Agent to sec.gov; an empty value fails at activation.
        secUserAgent: ''
        timeoutMs: 15000
        cacheTtlMs: 300000
        # SEC asks for at most ten requests a second; this paces each host.
        minRequestGapMs: 120
        maxBodyBytes: 8388608
        builtinProvider: true

    # Model tools `market_quote`, `market_history`, `market_profile` and
    # `market_filings`, plus the `/market <symbol>` summary. The caps bound
    # what one call can put into the request.
    - id: tool-market
      name: '@deepseek-ai/dsh-tool-market'
      disabled: true
      config:
        maxSymbols: 10
        maxBars: 60
        maxFilings: 10
        summaryBars: 30

    # `/digest` writes today's report to `<workspace>/.dsh/reports/<date>.md`;
    # `dailyAt: "HH:MM"` (local time) also writes it on a timer for every live
    # workspace and notifies through dsh-notify when mounted.
    # `/digest` writes the day's report, `/digest week` the weekly review with
    # trends; the timers are opt-in (`dailyAt: "HH:MM"`, `weeklyOn: "mon 07:00"`).
    - id: digest
      name: '@deepseek-ai/dsh-digest'
      config: {}

    - id: doctor
      name: '@deepseek-ai/dsh-doctor'
      config:
        probeTimeoutMs: 20000

    # Cron-started sessions: `/cron add <name> "<expr>" <prompt>` runs the
    # prompt in a fresh session on the schedule; ticks every 30s so no minute
    # is skipped, one run at a time, no catch-up after downtime.
    - id: cron-sessions
      name: '@deepseek-ai/dsh-cron-sessions'
      config:
        tickMs: 30000
        maxConcurrent: 1
        catchUp: false

    # Off-peak deferral: while enabled and the clock sits outside every window,
    # a goal round is queued instead of run, and the window resumes the queued
    # sessions. Off by default because discount hours are deployment-specific;
    # `/offpeak drain` runs the queue by hand at any hour. A profile patch
    # enables it, for example DeepSeek's own discount window:
    #   - id: off-peak
    #     config:
    #       enabled: true
    #       windows:
    #         - { start: '00:30', end: '08:30' }
    #       maxConcurrent: 2
    #       finishRoundInFlight: false
    - id: off-peak
      name: '@deepseek-ai/dsh-off-peak'
      config:
        enabled: false
        windows: []
        maxConcurrent: 2
        finishRoundInFlight: false

    # Token budgets: unlimited until a profile patch sets `perSessionTokens`
    # or `perDayTokens`; crossing one pauses the session's goal and asks the
    # model to finish the step.
    - id: spend-guard
      name: '@deepseek-ai/dsh-spend-guard'
      config:
        action: pause-goal

    # Outbound notifications need destinations, so the row ships disabled.
    # Enable it in a profile patch with your channels, for example:
    #   - id: notify
    #     disabled: false
    #     config:
    #       channels:
    #         - { name: phone, kind: telegram, botTokenEnv: TELEGRAM_BOT_TOKEN, chatId: '123456' }
    #         - { name: team, kind: discord, url: https://discord.com/api/webhooks/... }
    #         - { name: hook, kind: webhook, url: https://example.test/hydra, headers: { x-token: abc } }
    #       events: { goalBlocked: true, goalCompleted: true, transientRetriesExhausted: true, sessionError: false, cronRun: true, spendBudgetReached: true, dailyDigest: true, weeklyDigest: true, offPeakDrained: true }
    #       minIntervalMs: 5000
    #       timeoutMs: 10000
    # Put TELEGRAM_BOT_TOKEN in $DSH_HOME/.env; config carries only its name.
    - id: notify
      name: '@deepseek-ai/dsh-notify'
      disabled: true
      config:
        channels: []
        events:
          goalBlocked: true
          goalCompleted: true
          transientRetriesExhausted: true
          sessionError: false
          cronRun: true
          spendBudgetReached: true
          researchBreakthrough: true
          dailyDigest: true
          weeklyDigest: true
          offPeakDrained: true
        minIntervalMs: 5000
        timeoutMs: 10000

    # Learning: durable memory recalled into each session once approved, plus a
    # turn-end extractor that proposes candidates; `/learn` approves or promotes
    # them to skills. The extraction reuses the session's own model route.
    - id: memory
      name: '@deepseek-ai/dsh-memory'
      config:
        maxRecallBytes: 6000
        staleAfterDays: 30
        archiveAfterDays: 90
        # A note this similar to a stored one updates it instead of adding a copy,
        # and curation merges such groups into their newest wording.
        duplicateThreshold: 0.7
        # Clusters of remembered entries that share a topic tag or read alike
        # become skill suggestions for /memory suggestions and the Learning card.
        skillSuggestThreshold: 0.6
        skillSuggestMinEntries: 3

    # Document knowledge base: a full-text index over folders a profile patch
    # names under `collections` (none by default), kept up to date in the
    # background at start and by `/kb reindex`.
    - id: knowledge
      name: '@deepseek-ai/dsh-knowledge'
      config:
        path: !!js dshHomePath('knowledge/index.sqlite')
        collections: []

    - id: learning
      name: '@deepseek-ai/dsh-learning'
      config:
        # One extraction request after each turn with enough tool calls. Set
        # false on a slow local route, where that request queues ahead of the
        # next turn; /learn from and /research-ingest keep working.
        reviewTurns: true
        # Everything learned is recalled at once; `candidate` would hold it for /learn approve.
        fileAs: approved
        minToolCalls: 3
        maxCandidatesPerTurn: 5
        maxTranscriptBytes: 24000
        maxOutputTokens: 512
        timeoutMs: 60000
        # Second pass over tool failures followed by a working retry: one
        # "when X fails with Y, do Z" shortcut candidate per pair.
        errorPatterns:
          enabled: true
          maxPairsPerTurn: 5

    # A step that stops at the output-token limit continues by itself, up to
    # eight continuations per turn.
    - id: auto-continue
      name: '@deepseek-ai/dsh-auto-continue'
      config:
        maxContinuationsPerTurn: 8

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@deepseek-ai/dsh-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # The shared base enables the stable model-facing web_search and web_fetch
    # tools. The Web app disables this host row and composes both tools per agent
    # preset; products with a stricter network policy override tool-web. DeepSeek
    # search resolves the same DEEPSEEK_API_KEY
    # credential the Models page manages for chat, at each search; its Messages
    # endpoint is configured independently from the model route, so it takes its own
    # base-URL override. Anonymous fetch accepts only public HTTP(S) destinations,
    # resolves and validates every destination, and pins every actual connection.
    # Search is a full auxiliary model request with server-side retrieval, so this
    # shipped DeepSeek route gets 60s while the provider-neutral tool default
    # remains 30s. The DeepSeek Search and Fetch APIs register as
    # deepseek-search-api and deepseek-fetch-api with the same credential; the Web
    # search settings switch selects both in place of these defaults.
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: deepseek-official
        fetchProvider: http

    - id: web-search-deepseek
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-deepseek-api
      name: '@deepseek-ai/dsh-web-deepseek-api'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    - id: mcp-resources
      name: '@deepseek-ai/dsh-mcp-resources'

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # Shared tool definitions and the deployment’s native executor.
    - id: tools
      name: '@deepseek-ai/dsh-tools'
      config:
        # Repair model arguments before validation: exact numeric spellings,
        # the wider boolean words Z.ai's own GLM client accepts, JSON text for
        # an object or array parameter, and a dropped null for an optional
        # non-nullable parameter.
        argumentCoercion: lenient
        # `oneOf`, not `flat`: Z.ai's ZCode ships `oneOf: [X, {type: null}]` to
        # GLM and even rewrites `anyOf` into `oneOf`, so flattening was an
        # unfounded guess. Set `flat` only for a gateway proven to mishandle
        # unions.
        nullableParameters: oneOf

    - id: tool-executor-native
      name: '@deepseek-ai/dsh-tool-executor-native'

    - id: tool-executor-ptc
      name: '@deepseek-ai/dsh-tool-executor-ptc'
      disabled: true

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        personaPrefix: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'

    # The native DeepSeek adapter. No key or endpoint is inlined: both resolve per
    # request from the `llm-deepseek:` settings section over this entry, with the
    # key coming from the credential store below. Thinking defaults are a deployment
    # choice.
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'

    - id: llm-deepseek-account
      name: '@deepseek-ai/dsh-llm-deepseek-account'
