# The scenario's second command removes its own signal file with `rm -f`.
# Hydra's command gate refuses that rule when nobody can confirm it, so this
# scenario allows the one rule and keeps every other gate rule.
- id: command-gate
  config:
    mode: confirm
    unattendedMode: deny
    allow: [rm-destructive]
    denyExtra: []
    temporaryRoots: []
